<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas | Clientes</title><link rel="stylesheet" href="/style.css"><body>
<header><strong>atlas<span> / gestão comercial</span></strong><small>Ambiente de avaliação · dados fictícios</small></header>
<main><div class="heading"><div><h1>Clientes</h1><p>Organize os contatos e limites de crédito da sua carteira.</p></div><button id="new">Novo cliente</button></div>
<section class="filters" aria-label="Filtros"><label>Nome<input id="search" placeholder="Buscar cliente"></label><label>Situação<select id="status"><option value="">Todas</option><option>Ativo</option><option>Inativo</option></select></label><label>Crédito mínimo<input id="min" placeholder="0,00"></label><label>Ordenar por<select id="sort"><option value="name">Nome</option><option value="credit">Crédito</option></select></label><button id="filter">Filtrar</button><button class="secondary" id="clear">Limpar</button></section>
<pre id="error" role="alert" hidden></pre><div id="notice" role="status"></div>
<section id="editor" hidden><h2 id="formTitle">Novo cliente</h2><form id="form" novalidate><div class="grid"><label>Nome completo *<input name="name" required></label><label>E-mail *<input name="email" type="text" required></label><label>CPF *<input name="cpf" placeholder="000.000.000-00" required></label><label>Telefone *<input name="phone" placeholder="(81) 99999-9999" required></label><label>CEP<input name="cep" placeholder="00000-000"></label><label>Data de nascimento<input name="birth" type="date"></label><label>Limite de crédito (R$)<input name="credit" value="0" inputmode="decimal"></label><label>Situação<select name="status"><option>Ativo</option><option>Inativo</option></select></label></div><div class="actions"><button>Salvar cliente</button><button type="button" class="secondary" id="cancel">Cancelar</button></div></form></section>
<div class="tableWrap"><table><thead><tr><th>Cliente</th><th>CPF</th><th>Telefone</th><th>Crédito</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><footer><span id="count"></span><div><button class="secondary" id="prev">Anterior</button><span id="page"></span><button class="secondary" id="next">Próxima</button></div></footer></main><script src="/app.js"></script></body></html>
